  <path d="M50 470 H670" stroke="#c5d3e0" stroke-width="2"/>
  <text x="50" y="512" font-family="Helvetica" font-weight="bold" font-size="20" fill="#1e2a36">Conclusion: meets the 10,000 mm waterproof rating.</text>
  <text x="50" y="548" font-family="Helvetica" font-size="16" fill="#3d4a57">Median 10,400 mm. Seams taped and tested separately (pass).</text>
  <text x="50" y="576" font-family="Helvetica" font-size="16" fill="#3d4a57">Note: water repellency (DWR) declines with wear and is restored</text>
