  <text x="50" y="200" font-family="Helvetica" font-size="17" fill="#3d4a57">Method: ISO 811 hydrostatic head (water penetration)</text>
  <text x="50" y="228" font-family="Helvetica" font-size="17" fill="#3d4a57">Sample: StormShell Rain Jacket shell fabric, batch SS-24</text>
