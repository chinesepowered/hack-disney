<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 240 240">
  <defs>
    <pattern id="plaid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#c9a26b"/>
      <rect width="16" height="5" y="5" fill="#a97e4a" opacity="0.7"/>
      <rect width="5" height="16" x="5" fill="#a97e4a" opacity="0.7"/>
      <rect width="16" height="1.5" y="12" fill="#7b5530" opacity="0.6"/>
      <rect width="1.5" height="16" x="12" fill="#7b5530" opacity="0.6"/>
    </pattern>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b17d50"/><stop offset="1" stop-color="#9a6a41"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fbff"/><stop offset="1" stop-color="#9fd8e6"/>
    </linearGradient>
  </defs>
  <!-- coat -->
  <path d="M28 240 C34 196 76 182 120 182 C164 182 206 196 212 240 Z" fill="#c8995f"/>
  <path d="M28 240 C40 205 70 196 96 196 L120 240 Z" fill="#b3864f"/>
  <path d="M212 240 C200 205 170 196 144 196 L120 240 Z" fill="#b3864f"/>
  <path d="M96 196 L120 226 L144 196 C136 190 104 190 96 196 Z" fill="#f4ead8"/>
  <!-- ears -->
  <ellipse cx="62" cy="84" rx="15" ry="13" fill="#7f5434"/>
  <ellipse cx="62" cy="86" rx="7" ry="6" fill="#e9a99a"/>
  <ellipse cx="178" cy="84" rx="15" ry="13" fill="#7f5434"/>
  <ellipse cx="178" cy="86" rx="7" ry="6" fill="#e9a99a"/>
  <!-- head -->
  <rect x="48" y="70" width="144" height="128" rx="62" fill="url(#fur)"/>
  <!-- snout -->
  <rect x="68" y="124" width="104" height="74" rx="36" fill="#8d5d39"/>
  <ellipse cx="102" cy="146" rx="8" ry="4.5" fill="#3a2416"/>
  <ellipse cx="138" cy="146" rx="8" ry="4.5" fill="#3a2416"/>
  <path d="M108 168 Q120 177 132 168" stroke="#3a2416" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="86" cy="116" rx="8.5" ry="9.5" fill="#26170d"/>
  <ellipse cx="154" cy="116" rx="8.5" ry="9.5" fill="#26170d"/>
  <circle cx="89.5" cy="112" r="3" fill="#ffffff"/>
  <circle cx="157.5" cy="112" r="3" fill="#ffffff"/>
  <!-- blush -->
  <ellipse cx="70" cy="140" rx="12" ry="7" fill="#f3998a" opacity="0.55"/>
  <ellipse cx="170" cy="140" rx="12" ry="7" fill="#f3998a" opacity="0.55"/>
  <!-- deerstalker: back brim, crown, front brim, flaps tied on top -->
  <path d="M150 74 C176 70 200 78 206 88 C190 88 170 86 150 84 Z" fill="#9c7243"/>
  <path d="M60 80 C60 40 92 22 120 22 C148 22 180 40 180 80 C150 72 90 72 60 80 Z" fill="url(#plaid)" stroke="#6e4c28" stroke-width="2.5"/>
  <path d="M86 78 C70 80 46 86 34 96 C52 98 74 94 92 86 Z" fill="#9c7243" stroke="#6e4c28" stroke-width="2"/>
  <path d="M120 22 C122 40 122 60 120 76" stroke="#6e4c28" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M70 52 C82 40 96 36 108 40" stroke="#6e4c28" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M132 40 C146 36 160 42 170 52" stroke="#6e4c28" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M112 24 C104 14 98 12 96 16 C96 22 106 24 116 26 Z" fill="#9c7243" stroke="#6e4c28" stroke-width="1.5"/>
  <path d="M128 24 C136 14 142 12 144 16 C144 22 134 24 124 26 Z" fill="#9c7243" stroke="#6e4c28" stroke-width="1.5"/>
  <circle cx="120" cy="24" r="5" fill="#6e4c28"/>
  <!-- yuzu pinned to the hat -->
  <circle cx="160" cy="44" r="11" fill="#ffc531"/>
  <circle cx="157" cy="41" r="3" fill="#fff1b0" opacity="0.8"/>
  <path d="M160 33 C163 28 170 27 172 30 C168 33 164 34 160 33 Z" fill="#62b35a"/>
  <!-- magnifying glass -->
  <g transform="rotate(-24 196 170)">
    <rect x="190" y="182" width="12" height="46" rx="6" fill="#6e4c28"/>
    <circle cx="196" cy="160" r="27" fill="url(#lens)" opacity="0.92"/>
    <circle cx="196" cy="160" r="27" fill="none" stroke="#e1a83a" stroke-width="7"/>
    <path d="M182 150 C186 142 194 138 202 139" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- paw holding the glass -->
  <ellipse cx="190" cy="214" rx="15" ry="11" fill="#9a6a41"/>
</svg>
